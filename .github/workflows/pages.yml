name: Deploy Trayage website

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted, transferred]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (!github.event.issue.pull_request &&
      (contains(github.event.issue.labels.*.name, 'roadmap') || github.event.label.name == 'roadmap'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Sync approved GitHub roadmap issues
        run: npm run roadmap:sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Build approved Eleventy output for the configured Pages path
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REQUIRE_PUBLICATION_APPROVAL: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
