<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">A disk image and an installed Mac app are separate items</title>
<desc id="desc">Open the DMG and follow its installation steps. Eject the mounted image, then launch the installed app from Applications before deciding whether to remove the DMG.</desc>
<rect width="1200" height="630" rx="24" fill="#f7f6f2"/>
<g font-family="sans-serif" fill="#262722"><text x="70" y="80" font-size="22" letter-spacing="3">TRAYAGE / MAC GUIDES</text><text x="70" y="155" font-size="44" font-weight="600">The download. The installed app.</text>
<rect x="70" y="220" width="455" height="240" rx="16" fill="#f6e6d5" stroke="#d7bfa3"/>
<rect x="675" y="220" width="455" height="240" rx="16" fill="#e8eadd" stroke="#b6bea5"/>
<g stroke="#55594f" fill="none" stroke-width="5"><rect x="110" y="260" width="64" height="48" rx="6"/><path d="M110 292h64m-15 9h6"/><path d="M718 275v-15h25l12 15h38v45h-75z"/><path d="M552 340h95m-20-18 20 18-20 18"/></g>
<text x="110" y="365" font-size="32" font-weight="600">Installer.dmg</text><text x="110" y="408" font-size="23">The disk image in Downloads</text>
<text x="718" y="365" font-size="32" font-weight="600">Your installed app</text><text x="718" y="408" font-size="23">A separate copy in Applications</text>
<text x="70" y="520" font-size="23">Follow the installation steps. Eject the image. Open the installed app.</text><text x="70" y="565" font-size="21" fill="#65665d">Keep the DMG if it contains other files you need or an installer you want to archive.</text></g></svg>
